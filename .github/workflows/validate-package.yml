name: Validate and package HTS Pages
on:
  push:
    branches: [main, feature/second-links-map]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
      - name: PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript tests
        run: |
          npm install --no-save --package-lock=false jsdom@24
          node tests/layout.test.js
          node tests/ui.test.js
      - name: Build WordPress installation ZIP
        run: |
          mkdir -p dist/hts-pages
          cp hts-pages.php dist/hts-pages/
          cp -r assets includes dist/hts-pages/
          cd dist
          zip -qr hts-pages-fixed.zip hts-pages
      - uses: actions/upload-artifact@v4
        with:
          name: hts-pages-fixed
          path: dist/hts-pages-v0.6.3.zip
